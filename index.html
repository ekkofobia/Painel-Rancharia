<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Painel de pedidos</title>
<style>
:root{--bg:#e8e8e9;--ink:#2e1c11;--mut:#71717a;--line:#ececee;--dk:#3b2314;--em:#ff5a00}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.hd{max-width:720px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.brand{font-size:22px;font-weight:700;line-height:1.1}.brand small{display:block;font-size:12px;font-weight:400;color:var(--mut)}
main{max-width:720px;margin:0 auto;padding:16px}
button,input,select,textarea{font:inherit;color:inherit;border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 16px}
button{cursor:pointer}button:active{background:#ececee}
button.pri,#f button{background:var(--dk);border-color:var(--dk);color:#fff}button.rd{color:#b91c1c}
.pill{padding:3px 12px;border-radius:99px;font-size:13px;background:#ececee;color:var(--mut)}.pill.ok{background:#dcfce7;color:#15803d}
.box{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 4px 12px #0000000a}
#f{display:grid;gap:10px;max-width:380px;margin:12vh auto 0;padding:24px}#f h1{font-size:28px;margin:0}#erro{color:#b91c1c}
.stats{padding:14px 18px;font-size:17px;font-weight:600}
.cfg{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0;color:var(--mut);font-size:14px}.cfg select{padding:6px 12px}
.tabs{display:flex;gap:6px;background:#d9d9dc;border-radius:16px;padding:4px;margin:14px 0}
.tab{flex:1;border:0;background:none;font-weight:500;color:var(--mut);border-radius:12px}.tab.on{background:var(--dk);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px}.chip{white-space:nowrap;padding:6px 14px;font-size:14px;color:var(--mut);border-radius:99px}
.chip.on{background:var(--dk);border-color:var(--dk);color:#fff}.mut{color:var(--mut);font-size:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px 16px;margin:10px 0;cursor:pointer;box-shadow:0 4px 12px #0000000a}
.card.cancelado{opacity:.6}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.card .bt{flex-wrap:nowrap;gap:6px}.card .bt button{flex:1;min-width:0;padding:10px 6px;font-size:13px;white-space:nowrap}.card .bt button.ic{flex:none;padding:10px 12px}
.meta{color:var(--mut);font-size:14px;margin-top:2px}.warn{color:var(--em);font-weight:500}.chev{float:right}
.badge{font-size:12px;font-weight:600;padding:3px 10px;border-radius:12px}
.badge.novo{background:#fff1e8;color:var(--em);border:1px solid #ffd9c2}.badge.preparando{background:var(--dk);color:#fff}.badge.pronto{background:#dcfce7;color:#15803d}
.badge.entregue{background:#ececee;color:#52525b}.badge.cancelado{background:#fee2e2;color:#b91c1c}
pre{white-space:pre-wrap;font:13.5px/1.45 ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0 0}
.bt{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.dia{display:flex;justify-content:space-between}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--dk);color:#fff;padding:10px 18px;border-radius:14px;z-index:9;font-size:14px}
dialog{border:1px solid var(--line);border-radius:24px;padding:20px;width:min(92vw,460px);color:var(--ink)}dialog::backdrop{background:#3b231466}
#fe{display:grid;gap:10px}#fe textarea{min-height:220px;font:13.5px/1.4 ui-monospace,monospace}#fe label{font-size:13px;color:var(--mut);display:grid;gap:4px}
#ticket{display:none;color:#000;background:#fff;font-family:'Courier New',monospace;font-weight:700;line-height:1.25;margin:0 auto;padding:2mm 0 22mm}
#ticket.w80{width:72mm;font-size:13px}#ticket.w58{width:48mm;font-size:11px}
#ticket div{white-space:pre-wrap;overflow-wrap:anywhere}#ticket .c{text-align:center}#ticket .big{font-size:1.25em}
#ticket .sp{height:6px}#ticket hr{border:0;border-top:2px dashed #000;margin:5px 0}

/* ===== Menu hambúrguer ===== */
.ham{display:grid;gap:4px;align-content:center;width:42px;height:42px;padding:0;justify-items:center;flex:none}
.rf svg{display:block;transform-origin:50% 50%}.rf.spin svg{animation:sp .6s linear}@keyframes sp{to{transform:rotate(360deg)}}
.ham i{display:block;width:18px;height:2px;border-radius:2px;background:var(--ink)}
#ov{position:fixed;inset:0;background:#3b231466;z-index:20;opacity:0;transition:opacity .25s}
#ov.on{opacity:1}
#drw{position:fixed;top:0;right:0;bottom:0;width:min(78vw,280px);background:#fff;z-index:21;padding:20px 16px;display:flex;flex-direction:column;gap:8px;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:0 4px 24px #3b231433}#drw{overflow-y:auto}.sairb{margin-top:auto}
.cfgm{display:grid;gap:10px;margin-top:6px;padding:14px;border:1px solid var(--line);border-radius:16px;font-size:14px}.cfgm label{display:flex;gap:10px;align-items:center;color:var(--mut)}.cfgm input[type=checkbox]{width:20px;height:20px;padding:0;flex:none}
#drw.on{transform:none}
#drw h2{margin:0 0 8px;font-size:20px}#drw h2 small{display:block;font-size:12px;font-weight:400;color:var(--mut)}
.mi{text-align:left;display:flex;align-items:center;gap:10px;font-weight:500;padding:12px 14px}
.mi.on{background:var(--dk);border-color:var(--dk);color:#fff}
/* ===== Cardápio ===== */
#fg{display:grid;gap:10px}#fg label{font-size:13px;color:var(--mut);display:grid;gap:4px}#fg .bt button{flex:1}
.cb{display:flex;gap:8px;margin:10px 0}.cb button{flex:1}
.cg{margin:18px 0 4px;display:flex;align-items:center;justify-content:space-between;gap:8px}.cg h3{margin:0;font-size:16px}.cg button{padding:6px 14px;font-size:13px}
.pr{padding:14px;margin:8px 0;display:grid;gap:12px}.pr.off{background:#f3e9e4}.pr.off .pn{opacity:.55;text-decoration:line-through}
.pt{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pn{display:block;background:none;border:0;padding:0;text-align:left;font-size:16px;font-weight:600;color:var(--ink);border-radius:0}
.pd{color:var(--mut);font-size:13px;margin-top:2px}
.bdg{display:inline-block;margin-top:6px;background:#b91c1c;color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;letter-spacing:.04em}
.pp{display:flex;align-items:center;gap:6px;white-space:nowrap;color:var(--mut);font-size:14px}.pp input{width:92px;text-align:right;font-weight:700;color:var(--ink);padding:8px 10px}
.pz{width:100%;padding:15px;font-size:16px;font-weight:700;background:#fff;border:2px solid #b91c1c;color:#b91c1c}
.pz.on{background:#15803d;border-color:#15803d;color:#fff}
.sqlb{background:#f4f4f5;border:1px solid var(--line);border-radius:12px;padding:12px;font:12px/1.4 ui-monospace,monospace;max-height:200px;overflow:auto;white-space:pre;margin:8px 0}
/* ===== Apagar ===== */
.tab2{flex:1;border:0;background:none;font-weight:500;color:var(--mut);border-radius:12px;padding:10px 4px}.tab2.on{background:var(--dk);color:#fff}
.xi{display:flex;gap:12px;align-items:center;margin:8px 0}.xi input{width:22px;height:22px;padding:0;flex:none}
.xf{display:grid;gap:6px;color:var(--mut);font-size:14px;margin:6px 0}
button.dng{background:#b91c1c;border-color:#b91c1c;color:#fff;font-weight:600;width:100%;position:sticky;bottom:12px;margin-top:10px}button.dng:disabled{background:#d4a5a5;border-color:#d4a5a5}
/* ===== Dashboard de pedidos ===== */
.dbtop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}.dbtop h2{margin:0;font-size:22px}
.dash{padding:16px 18px;margin:12px 0}
.dash h3{margin:0;font-size:14px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.big2{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 2px}
.big2 b{font-size:38px;line-height:1;font-weight:700}.big2 span{color:var(--mut);font-size:15px}
.tot{font-weight:600;font-size:17px}
.bars{display:flex;align-items:flex-end;gap:3px;height:110px;margin-top:14px}
.bc{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bar{width:100%;border-radius:6px 6px 2px 2px;background:var(--dk);opacity:.75;min-height:2px;transform-origin:bottom;animation:grow .5s ease both}
.bar.z{background:var(--line);opacity:1}.bar.now{background:var(--em);opacity:1}
.bn{font-size:10px;color:var(--mut);height:14px;line-height:14px}
.lb{display:flex;gap:3px;margin-top:4px}.lb span{flex:1;min-width:0;text-align:center;font-size:10px;color:var(--mut);white-space:nowrap;overflow:visible}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media print{html,body{background:#fff!important;padding:0!important;margin:0!important}body>*:not(#ticket){display:none!important}#ticket{display:block}@page{margin:0}}

.rkh0{margin:20px 0 4px;font-size:16px}.rk summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:16px}.rk summary::-webkit-details-marker{display:none}.rk summary::after{content:"▾";color:var(--mut);transition:transform .2s}.rk[open] summary::after{transform:rotate(180deg)}
.rkh{margin:16px 0 4px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.rki{display:flex;gap:10px;align-items:center;margin:9px 0}.rkn{width:28px;flex:none;font-size:13px;color:var(--mut);font-weight:600}.rkb{flex:1;min-width:0}
.rkt{display:flex;justify-content:space-between;gap:8px;font-size:14px}.rkt span{font-weight:700}
.rkbar{height:6px;border-radius:99px;background:var(--line);margin-top:4px}.rkbar i{display:block;height:100%;border-radius:99px;background:var(--dk)}
/* ===== Cardápio no estilo do site ===== */
#vc{--g:#f2c46d;--cr:#f7ecd8;--mu:#cdb99c;--ln:rgba(242,196,109,.24);background:#2a1509;color:var(--cr);font-family:Outfit,system-ui,sans-serif;border-radius:22px;padding:16px 14px 20px;margin:-4px 0 0}
#vc .ctop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
#vc .ctop h2{margin:0;font:400 38px/1 Anton,Impact,sans-serif;text-transform:uppercase;color:var(--cr)}
#vc .ctop .scr{display:block;margin-top:-4px;font:400 30px/1 Yellowtail,cursive;color:var(--g)}
#vc button{font-family:inherit}#vc #cv{background:none;border:1px solid var(--ln);color:var(--cr);border-radius:999px;padding:8px 16px}
#vc .mut{color:var(--mu)}#vc .box{background:#341d0f;border:1px solid var(--ln);color:var(--cr);border-radius:18px}#vc .dash h3{color:var(--g)}
#vc .cb button{border:1px solid var(--g);background:none;color:var(--g);border-radius:999px;font-weight:700;padding:12px}#vc .cb .pri,#vc .box .pri{background:var(--g);color:#2a1509;border-color:var(--g)}
#vc .plate{padding:14px;margin:14px 0;border-radius:22px;background:linear-gradient(160deg,#402617,#341d0f 55%);border:1px solid var(--ln)}
#vc .ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
#vc .ph h3{margin:0;font-weight:800;font-size:21px;line-height:1.1;color:var(--g);text-transform:uppercase}#vc .ph h3 span{color:var(--mu);font-size:13px;font-weight:600}
#vc .ph button{background:none;border:1px solid var(--ln);color:var(--cr);border-radius:999px;padding:6px 14px;font-size:13px}
#vc .ph .ttl{background:none;border:0;padding:0;border-radius:0;color:var(--g);font:inherit;font-weight:800;font-size:21px;text-transform:uppercase;text-align:left}#vc .ph .itr{gap:8px}
#vc .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--ln)}
#vc .it.off .pn2{opacity:.5;text-decoration:line-through}
#vc .ph>div:first-child,#vc .it{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#vc .drag{position:fixed!important;z-index:60;margin:0!important;box-shadow:0 14px 34px rgba(0,0,0,.55);opacity:.96;pointer-events:none;border-radius:16px;background:#4a2d1a;scale:1.02}
#vc .it.drag{padding-left:12px;padding-right:12px}
#vc .dph{border:2px dashed var(--g);border-radius:16px;opacity:.55}
body.dragging{overscroll-behavior:contain}
#vc .pn2{background:none;border:0;padding:0;text-align:left;font-size:16px;font-weight:600;color:var(--cr)}
#vc .pd2{color:var(--mu);font-size:13px;margin-top:2px}
#vc .bdg{display:inline-block;margin-top:5px;background:#b91c1c;color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
#vc .itr{display:flex;align-items:center;gap:8px;flex:none}
#vc .pill{display:flex;align-items:center;justify-content:center;gap:2px;width:78px;box-sizing:border-box;background:var(--g);color:#2a1509;border-radius:999px;padding:2px 8px;font-weight:800}#vc .pill small{font-size:11.2px}
#vc .pill input{width:100%;min-width:0;background:none;border:0;padding:3px 0;color:#2a1509;font-weight:800;font-size:16.7px;text-align:right;outline:none}
#vc .pxb{flex:none;width:30px;height:30px;padding:0;display:grid;place-items:center;background:none;border:1px solid #e58b8b;color:#e58b8b;border-radius:50%;font-size:17px;line-height:1}
#vc .inc{color:var(--mu);font-size:13px;padding:0 6px}
#vc .pzb{background:none;border:1px solid #e58b8b;color:#e58b8b;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600}#vc .pzb.on{border-color:#7bd389;color:#7bd389}
#dg{background:#341d0f;color:#f7ecd8;border:1px solid rgba(242,196,109,.4);border-radius:22px;font-family:Outfit,system-ui,sans-serif}#dg::backdrop{background:#2a150999}
#dg{overflow-x:hidden}#fg{grid-template-columns:minmax(0,1fr)}#fg label{min-width:0}#fg input,#fg select,#fg textarea{width:100%;max-width:100%;min-width:0;box-sizing:border-box;text-overflow:ellipsis}
#dg label,#dg .mut{color:#cdb99c}#dg input,#dg select{background:#2a1509;color:#f7ecd8;border:1px solid rgba(242,196,109,.3);border-radius:12px}
#dg .bt button{border-radius:999px;background:none;border:1px solid rgba(242,196,109,.4);color:#f7ecd8}#dg .bt .pri{background:#f2c46d;color:#2a1509;border-color:#f2c46d;font-weight:700}#dg .bt .rd{color:#e58b8b;border-color:#e58b8b}

/* ===== Tema "Site" (escuro/dourado) — liga e desliga em Menu > Tema ===== */
body.tsite{--bg:#2a1509;--ink:#f7ecd8;--mut:#cdb99c;--line:rgba(242,196,109,.24);--dk:#f2c46d;--em:#ff9a5c;font-family:Outfit,"DM Sans",system-ui,sans-serif}
body.tsite header{background:#341d0f}
body.tsite .brand,body.tsite #f h1,body.tsite .dbtop h2{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.02em;text-transform:uppercase}
body.tsite button,body.tsite input,body.tsite select,body.tsite textarea{background:#341d0f;color:var(--ink);border-color:var(--line)}
body.tsite button:active{background:#402617}
body.tsite button.pri,body.tsite #f button,body.tsite .tab.on,body.tsite .chip.on,body.tsite .mi.on,body.tsite .tab2.on,body.tsite #toast,body.tsite .badge.preparando{background:#f2c46d;border-color:#f2c46d;color:#2a1509}
body.tsite button.rd,body.tsite #erro{color:#e58b8b}
body.tsite .tab,body.tsite .tab2{background:none;border:0;color:var(--mut)}
body.tsite .pill{background:rgba(242,196,109,.15);color:var(--mut)}body.tsite .pill.ok{background:#14301b;color:#7bd389}
body.tsite .box,body.tsite dialog{background:#341d0f;border-color:var(--line);box-shadow:none;color:var(--ink)}
body.tsite .card{background:linear-gradient(160deg,#402617,#341d0f 55%);border-color:var(--line);box-shadow:none}
body.tsite .tabs{background:#1f0f06}
body.tsite .badge.novo{background:rgba(255,154,92,.15);color:var(--em);border-color:rgba(255,154,92,.4)}
body.tsite .badge.pronto{background:#14301b;color:#7bd389}body.tsite .badge.entregue{background:rgba(255,255,255,.08);color:var(--mut)}body.tsite .badge.cancelado{background:#3a1515;color:#e58b8b}
body.tsite pre,body.tsite .sqlb{background:#2a1509;border-color:var(--line)}
body.tsite #drw{background:#341d0f}body.tsite dialog::backdrop{background:#2a150999}
body.tsite #vc{background:none;padding:0;margin:0}
.lojabt{width:100%;margin:10px 0 0;padding:14px;font-weight:700;font-size:16px;border-radius:18px;border:1px solid var(--line);background:#fff}
.lojabt.on{background:#14301b;border-color:#7bd389;color:#7bd389}.lojabt.off{background:#3a1515;border-color:#e58b8b;color:#e58b8b}
/* ===== Interruptores (tema e loja) ===== */
.sw{position:relative;display:flex;align-items:center;justify-content:space-between;width:96px;height:46px;padding:0 13px;margin:8px 0;border-radius:99px;background:#fff;border:1px solid var(--line);box-shadow:0 6px 18px #0002;flex:none}
.sw .ic{display:grid;place-items:center;width:22px;height:22px;color:#a5b4cf}.sw svg{width:22px;height:22px;display:block}
.sw .k{position:absolute;top:3px;left:3px;width:38px;height:38px;border-radius:50%;background:var(--dk);color:#fff;display:grid;place-items:center;transition:transform .25s;box-shadow:0 3px 8px #0003}
.sw.r .k{transform:translateX(50px)}
body.tsite .sw{background:#341d0f}body.tsite .sw .ic{color:#7d6a52}body.tsite .sw .k{color:#2a1509}
body .sw.lj .k{color:#fff}.sw.lj.ok .k{background:#2f9e5a}.sw.lj.bad .k{background:#d14343}.sw.lj.nul .k{background:#8a8a8a}
.hd{gap:8px}.ham{width:34px;height:34px;gap:3.3px}.ham i{width:15px}.rf svg{width:18px;height:18px}
.rb{flex:none;width:34px;height:34px;padding:0;border-radius:50%;display:grid;place-items:center;border:0;color:#fff;box-shadow:0 3px 8px #0003}.rb svg{width:18px;height:18px;display:block}
body .rb.lj.ok{background:#2f9e5a;color:#fff}body .rb.lj.bad{background:#d14343;color:#fff}body .rb.lj.nul{background:#8a8a8a;color:#fff}
/* preço = mesma altura do botão Pausar; filtros sem barra de rolagem e com aviso de "tem mais" */
#vc .pill{height:30px;padding:0 8px}#vc .pill input{height:100%;padding:0;font-size:16.7px;line-height:30px}#vc .pzb{height:30px;padding:0 11px;display:grid;place-items:center}
.chips{scrollbar-width:none;-ms-overflow-style:none}.chips::-webkit-scrollbar{display:none}
.chips.md{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 44px),transparent)}
.chips.me{-webkit-mask-image:linear-gradient(to left,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(to left,#000 calc(100% - 44px),transparent)}
.chips.md.me{-webkit-mask-image:linear-gradient(to right,transparent,#000 44px,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(to right,transparent,#000 44px,#000 calc(100% - 44px),transparent)}
</style><link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@400;500;600;700;800&family=Yellowtail&display=swap" rel="stylesheet"></head><body>
<header id="hd" hidden><div class="hd"><div class="brand"><span class="nm"></span></div><span id="s" class="pill">…</span><button id="lojaBt" class="rb lj nul" type="button" style="margin-left:auto"></button><button id="rf" class="ham rf" aria-label="Atualizar" title="Atualizar"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button><button id="mn" class="ham" aria-label="Abrir menu"><i></i><i></i><i></i></button></div></header>
<form id="f" class="box"><h1 class="nm"></h1><span class="mut">Painel de pedidos</span><input id="em" type="email" placeholder="E-mail" autocomplete="username" required>
<input id="pw" type="password" placeholder="Senha" autocomplete="current-password" required><button>Entrar</button><div id="erro"></div></form>
<div id="ov" hidden></div>

const CFG={url:'https://svvvzwsajneesmuatcvc.supabase.co',key:'sb_publishable_ARLDqBsmhhhfOUp6I2zKiw_9G7pQ5_O',nome:'Rancharia'};
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),R=v=>(+v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let ses=LS('ses',null),P=[],seen=null,last='',auto=LS('auto',false),papel=LS('papel','w80'),aba='p',filtro='ativos',diaSel=null,tm=null,audio=null;

const tipo=p=>((p.detalhes||'').match(/^Tipo:\s*(.+)$/m)||[])[1]||'';

const TO=()=>{const a=new AbortController();a.t=setTimeout(()=>a.abort(),12000);return a};
async function auth(kind,body){const ac=TO(),r=await fetch(CFG.url+'/auth/v1/token?grant_type='+kind,{signal:ac.signal,method:'POST',headers:{apikey:CFG.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
 clearTimeout(ac.t);const j=await r.json();if(!r.ok)throw new Error('auth');j.exp=Date.now()+(j.expires_in-60)*1000;ses=j;SV('ses',j)}
async function api(path,opt={}){if(Date.now()>ses.exp)await auth('refresh_token',{refresh_token:ses.refresh_token});
 const ac=TO(),r=await fetch(CFG.url+'/rest/v1/'+path,{signal:ac.signal,...opt,headers:{apikey:CFG.key,Authorization:'Bearer '+ses.access_token,'Content-Type':'application/json',...(opt.headers||{})}});
 clearTimeout(ac.t);if(!r.ok)throw new Error(r.status);if(opt.method==='PATCH')return null;const tx=await r.text();return tx?JSON.parse(tx):null}

$('#f').onsubmit=async e=>{e.preventDefault();$('#erro').textContent='';audio=audio||new AudioContext();
 try{await auth('password',{email:$('#em').value.trim(),password:$('#pw').value});entrar()}catch(x){$('#erro').textContent='E-mail ou senha incorretos.'}};
function entrar(){$('#f').hidden=true;$('#app').hidden=false;$('#hd').hidden=false;$('#stats').textContent='Carregando…';carregar();loadLoja();clearInterval(tm);tm=setInterval(carregar,5000);try{navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}}

function beep(){try{const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=880;g.gain.value=.2;o.start();o.stop(audio.currentTime+.3)}catch(e){}}
async function carregar(){try{const d=await api('pedidos?select=id,created_at,cliente,total,detalhes,status,impresso_em&order=created_at.desc&limit=500');
 $('#s').textContent='Ao vivo';$('#s').className='pill ok';
 const novos=seen?d.filter(p=>!seen.has(p.id)):[];seen=new Set(d.map(p=>p.id));
 const h=JSON.stringify(d);if(h===last)return;last=h;P=d;desenhar();
 if(novos.length){beep();if(auto)novos.reverse().forEach(imprimir)}
}catch(e){if(e.message==='401'||e.message==='auth')sair();else{$('#s').textContent='Sem conexão';$('#s').className='pill';if(!P.length)$('#stats').textContent='Sem conexão — toque em ↻ pra tentar de novo'}}}

const ST={novo:'Novo',preparando:'Preparando',pronto:'Pronto',entregue:'Entregue',cancelado:'Cancelado'},ab={};
const aberto=p=>ab[p.id]??false; // pedido chega fechado; clica no card pra abrir
function card(p){const nx=NX[p.status],a=ATIVO.includes(p.status),o=aberto(p),b=(x,t,c,ic)=>`<button class="${c||''}" data-a="${x}" data-id="${p.id}"${ic?` aria-label="${ic}" title="${ic}"`:''}>${t}</button>`;
 return `<div class="card" data-id="${p.id}"><div class="top"><b>#${pad(p.n)} ${esc(p.cliente)}</b><span class="badge ${p.status}">${ST[p.status]}</span></div>
<div class="meta">${new Date(p.created_at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})} · ${esc(tipo(p)||'—')} · <b>${R(p.total)}</b>${p.impresso_em?' · 🖨️ impresso':(a?' · <span class="warn">não impresso</span>':'')}<span class="chev">${o?'▾':'▸'}</span></div>
${o?`<pre>${esc((p.detalhes||'').replace(/\*/g,''))}</pre>`:''}
<div class="bt">${b('print','🖨️ Imprimir')}${nx?b(nx[0],nx[1],'pri'):''}${a?b('cancelado','Cancelar','rd'):''}${p.status==='entregue'?'':b('edit','✍️','ic','Editar pedido')}</div></div>`}

function desenhar(){const m={};[...P].reverse().forEach(p=>{const d=dia(p);m[d]=(m[d]||0)+1;p.n=m[d]});
 const hj=P.filter(p=>dia(p)===hoje()&&p.status!=='cancelado');
 $('#stats').textContent=hj.length+' pedidos hoje · '+R(hj.reduce((s,p)=>s+ +p.total,0));
 $('#vp').hidden=aba!=='p';$('#vh').hidden=aba!=='h';
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===aba));
 document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b.dataset.f===filtro));
 const d=diaSel||hoje();$('#dtxt').innerHTML=diaSel?'Dia '+d.split('-').reverse().join('/')+' <button id="hj">voltar para hoje</button>':'';
 const L=P.filter(p=>dia(p)===d&&(filtro==='todos'||(filtro==='ativos'?ATIVO.includes(p.status):p.status===filtro)));
 $('#lista').innerHTML=L.length?L.map(card).join(''):'<p class="mut">Nenhum pedido aqui.</p>';
 const g={};P.forEach(p=>{const k=dia(p);g[k]=g[k]||{n:0,t:0};g[k].n++;if(p.status!=='cancelado')g[k].t+=+p.total});
 $('#vh').innerHTML=Object.keys(g).sort().reverse().map(k=>`<div class="card dia" data-d="${k}"><b>${k.split('-').reverse().join('/')}</b><span>${g[k].n} pedidos · ${R(g[k].t)}</span></div>`).join('')||'<p class="mut">Sem histórico.</p>'}

const fila=[];let ocup=false;
function imprimir(p,sync){fila.push(p);bomba(sync)}
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(e.t);e.t=setTimeout(()=>e.hidden=true,2500)}
function bomba(sync){if(ocup||!fila.length)return;ocup=true;const p=fila.shift();
 const go=()=>{try{cupom(p);toast('🖨️ Enviando para impressão…');window.print()}catch(e){toast('Não foi possível abrir a impressão')}
  if(!p.impresso_em)mudar(p,{impresso_em:new Date().toISOString()});setTimeout(()=>{ocup=false;bomba()},1500)};
 sync?go():setTimeout(go,150)}
function cupom(p){const t=$('#ticket');t.className=papel;t.innerHTML='';
 const add=(x,c)=>{const d=document.createElement('div');if(c)d.className=c;d.textContent=x;t.appendChild(d)};
 add('PEDIDO Nº '+pad(p.n||0),'c big');add(new Date(p.created_at).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}),'c');t.appendChild(document.createElement('hr'));
 (p.detalhes?p.detalhes.replace(/\*/g,''):'Cliente: '+p.cliente+'\nTotal: '+R(p.total)).split('\n').forEach(l=>{l=l.trimEnd();
  if(/^[━─=\-]{5,}$/.test(l.trim()))t.appendChild(document.createElement('hr'));
  else if(!l.trim()){const s=document.createElement('div');s.className='sp';t.appendChild(s)}
  else add(l,/^(Tipo:|Total:)/.test(l)?'big':'')})}

async function mudar(p,c){try{await api('pedidos?id=eq.'+p.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(c)});Object.assign(p,c);last='';desenhar();return true}catch(e){alert('Não foi possível salvar. Confira a conexão (e se o SQL de edição foi rodado).');return false}}
$('#lista').onclick=e=>{const c=e.target.closest('.card');if(!c)return;const p=P.find(x=>String(x.id)===c.dataset.id),b=e.target.closest('button');
 if(!p)return;if(!b){ab[p.id]=!aberto(p);desenhar();return}const a=b.dataset.a;
 if(a==='print')imprimir(p,true);else if(a==='edit')editar(p);else if(a!=='cancelado'||confirm('Cancelar este pedido?'))mudar(p,{status:a})};
function editar(p){edP=p;$('#ec').value=p.cliente;$('#et').value=p.total;$('#ed').value=p.detalhes||'';$('#dlg').showModal()}
let edP=null;
$('#fe').onsubmit=async e=>{e.preventDefault();const c={cliente:$('#ec').value.trim().slice(0,80),total:parseFloat($('#et').value),detalhes:$('#ed').value.slice(0,4000)};
 if(!c.cliente||!(c.total>=0)){alert('Confira o nome e o total.');return}if(await mudar(edP,c))$('#dlg').close()};

/* ===== Dashboard de pedidos: dia / mês / ano ===== */
// Busca o ano inteiro (paginado de 1000 em 1000, limite padrão do Supabase)
async function pedidosAno(){const ini=encodeURIComponent(new Date(new Date().getFullYear(),0,1).toISOString());let out=[],i=0;
 for(;;){const r=await api('pedidos?select=created_at,total,status&created_at=gte.'+ini+'&order=created_at.desc',{headers:{'Range-Unit':'items',Range:i+'-'+(i+999)}});
  out=out.concat(r);if(r.length<1000)break;i+=1000}
 return out}
function bloco(titulo,sub,arr,n,idx,rot,atual,mostraNum){
 const c=Array(n).fill(0);arr.forEach(x=>c[idx(x.dt)]++);const mx=Math.max(1,...c),tot=arr.reduce((s,x)=>s+x.t,0);
 const bars=c.map((v,i)=>`<div class="bc" title="${rot(i)}: ${v} pedido${v===1?'':'s'}"><div class="bn">${mostraNum&&v?v:''}</div><div class="bar${v?'':' z'}${i===atual?' now':''}" style="height:${v?Math.max(6,v/mx*88):2}px;animation-delay:${i*12}ms"></div></div>`).join('');
 const lab=c.map((_,i)=>`<span>${(n<=12||i%(n>24?3:5)===0||(n===31&&i===0))?rot(i,1):''}</span>`).join('');
 return `<div class="box dash"><h3>${titulo}</h3><div class="big2"><b>${arr.length}</b><span>pedido${arr.length===1?'':'s'}</span></div>
 <div class="tot">${R(tot)}</div><div class="mut">${sub}</div><div class="bars">${bars}</div><div class="lb">${lab}</div></div>`}
/* ===== Ranking de itens (semana / mês / 6 meses) ===== */
let RKD=null;
const RKP=[['Semana (últimos 7 dias)','d7'],['Mês (últimos 30 dias)','d30'],['3 meses','m3'],['6 meses','m6'],['12 meses','m12']];
const rkIni=k=>{const d=new Date(),n=+String(k).slice(1);if(k[0]==='d')d.setDate(d.getDate()-n);else d.setMonth(d.getMonth()-n);d.setHours(0,0,0,0);return d};
async function pedidosRk(){const ini=encodeURIComponent(rkIni('m12').toISOString());let out=[],i=0;
 for(;;){const r=await api('pedidos?select=created_at,status,detalhes&created_at=gte.'+ini+'&order=created_at.desc',{headers:{'Range-Unit':'items',Range:i+'-'+(i+999)}});out=out.concat(r);if(r.length<1000)break;i+=1000}
 return out}
function rkParse(det){const its=[];String(det||'').split('\n').forEach(l=>{let m=l.match(/^\s*(\d+)x\s+(.+?)\s+—\s+R\$/);
 if(m){its.push({q:+m[1],n:m[2].trim(),b:[]});return}
 m=l.match(/^\s*•\s*([^:]+):\s*(.*)$/);if(m&&its.length)its[its.length-1].b.push([m[1].trim(),m[2].trim()])});return its}
function rkCalc(arr){const C={p:{},g:{},s:{},b:{}},add=(c,k,q)=>{if(k)C[c][k]=(C[c][k]||0)+q};
 arr.forEach(o=>rkParse(o.detalhes).forEach(it=>{
  if(!it.b.some(x=>/^prote/i.test(x[0]))){add('b',it.n,it.q);return}
  add('p',it.n,it.q);
  it.b.forEach(([k,v])=>{if(/^prote|^obs/i.test(k))return;
   v.split(',').map(s=>s.trim()).filter(s=>s&&!/^nenhuma$/i.test(s)).forEach(n=>add(/^guarni/i.test(k)?'g':'s',n,it.q))})}));return C}
function rkHTML(C){return [['p','Pratos'],['g','Guarnições'],['s','Saladas'],['b','Bebidas']].map(([k,t])=>{
 const L=Object.entries(C[k]).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'pt-BR')),mx=L.length?L[0][1]:1;
 return `<div class="rkh">${t}</div>`+(L.length?L.map((x,i)=>`<div class="rki"><span class="rkn">${i+1}º</span><div class="rkb"><div class="rkt"><b>${esc(x[0])}</b><span>${x[1]}</span></div><div class="rkbar"><i style="width:${Math.max(4,x[1]/mx*100)}%"></i></div></div></div>`).join(''):'<p class="mut">Sem pedidos no período.</p>')}).join('')}
const rkCards=()=>'<h3 class="rkh0">Ranking de itens pedidos</h3>'+RKP.map(([t,d])=>`<details class="box dash rk" data-rk="${d}"><summary>${t}</summary><div class="rkc"><p class="mut">Carregando…</p></div></details>`).join('');
$('#vd').addEventListener('toggle',async e=>{const d=e.target;if(!d.matches||!d.matches('details.rk')||!d.open)return;const box=d.querySelector('.rkc');
 try{RKD=RKD||pedidosRk();const data=await RKD,ini=rkIni(d.dataset.rk);box.innerHTML=rkHTML(rkCalc(data.filter(o=>o.status!=='cancelado'&&new Date(o.created_at)>=ini)))}
 catch(x){RKD=null;box.innerHTML='<p class="mut">Não foi possível carregar o ranking.</p>'}},true);
async function abrirDash(){RKD=null;marcaMenu('ped');tela('vd');const v=$('#vd');
 v.innerHTML='<div class="dbtop"><h2>Análise</h2><button id="dv">Voltar</button></div><p class="mut">Carregando…</p>';
 try{const d=await pedidosAno();
  const L=d.filter(p=>p.status!=='cancelado').map(p=>({dt:new Date(p.created_at),t:+p.total||0}));
  const n=new Date(),Y=n.getFullYear(),M=n.getMonth(),D=n.getDate();
  const mes=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'],mesL=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const doMes=L.filter(x=>x.dt.getMonth()===M),doDia=doMes.filter(x=>x.dt.getDate()===D);
  const dias=new Date(Y,M+1,0).getDate();
  v.innerHTML='<div class="dbtop"><h2>Análise</h2><button id="dv">Voltar</button></div>'+
   bloco('Hoje',pad(D)+'/'+pad(M+1)+'/'+Y+' · por hora',doDia,24,x=>x.getHours(),(i,s)=>s?i+'h':i+'h',n.getHours(),false)+
   bloco('Este mês',mesL[M]+' · por dia',doMes,dias,x=>x.getDate()-1,(i,s)=>s?i+1:'Dia '+(i+1),D-1,false)+
   bloco('Este ano',Y+' · por mês',L,12,x=>x.getMonth(),(i)=>mes[i],M,true)+
   rkCards()+'<p class="mut">Pedidos cancelados não entram na contagem nem no valor.</p>'}
 catch(e){v.innerHTML='<div class="dbtop"><h2>Análise</h2><button id="dv">Voltar</button></div><p class="mut">Não foi possível carregar. Confira a conexão.</p>'}}

/* ===== Apagar pedidos: individual / dia / semana / mês ===== */
const MESL=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const XV={dia:hoje(),sem:hoje(),mes:''};let mx='ind',selX=new Set(),xn=0,xtok=0;
const SQLDEL='grant delete on pedidos to authenticated;\ncreate policy "apagar pedidos" on pedidos for delete to authenticated using (true);';
function meses(){const n=new Date(),o=[];for(let i=0;i<12;i++){const d=new Date(n.getFullYear(),n.getMonth()-i,1);o.push([d.getFullYear()+'-'+pad(d.getMonth()+1),MESL[d.getMonth()]+' '+d.getFullYear()])}return o}
// devolve [inicio, fim, texto] do período escolhido (ou null)
function faixa(m){const f=x=>pad(x.getDate())+'/'+pad(x.getMonth()+1);
 if(m==='dia'){if(!XV.dia)return null;const[y,mo,d]=XV.dia.split('-').map(Number);return[new Date(y,mo-1,d),new Date(y,mo-1,d+1),f(new Date(y,mo-1,d))+'/'+y]}
 if(m==='sem'){if(!XV.sem)return null;const[y,mo,d]=XV.sem.split('-').map(Number),dw=(new Date(y,mo-1,d).getDay()+6)%7,a=new Date(y,mo-1,d-dw),b=new Date(y,mo-1,d-dw+7);return[a,b,'Semana '+f(a)+' a '+f(new Date(y,mo-1,d-dw+6))]}
 const[y,mo]=(XV.mes||meses()[0][0]).split('-').map(Number);return[new Date(y,mo-1,1),new Date(y,mo,1),MESL[mo-1]+' '+y]}
const qf=f=>'created_at=gte.'+encodeURIComponent(f[0].toISOString())+'&created_at=lt.'+encodeURIComponent(f[1].toISOString());
function abrirApagar(){marcaMenu('del');tela('vx');selX.clear();renderX()}
function renderX(){const v=$('#vx'),tb=[['ind','Individual'],['dia','Dia'],['sem','Semana'],['mes','Mês']];
