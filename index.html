<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Painel de pedidos</title>
<style>
:root{--bg:#f6f7f9;--ink:#061b31;--mut:#64748d;--line:#e5edf5;--ind:#533afd;--wash:#e8e9ff;--r:4px}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Inter Tight",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.hd{max-width:720px;margin:0 auto;padding:12px 14px;display:flex;align-items:center;gap:10px}
.brand{font-size:21px;font-weight:600;letter-spacing:-.02em;line-height:1.1}.brand small{display:block;font-size:12px;font-weight:400;color:var(--mut);letter-spacing:0}
main{max-width:720px;margin:0 auto;padding:14px}
button,input,select,textarea{font:inherit;color:inherit;border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:9px 13px}
button{cursor:pointer}button:active{background:#eef1f7}
button.pri,#f button{background:var(--ind);border-color:var(--ind);color:#fff}button.rd{color:#b91c1c}button.ic{margin-left:auto;padding:9px 12px}
.pill{padding:3px 10px;border-radius:var(--r);font-size:13px;background:#eef2f7;color:var(--mut)}.pill.ok{background:#dcfce7;color:#15803d}
.box{background:#fff;border:1px solid var(--line);border-radius:var(--r)}
#f{display:grid;gap:10px;max-width:380px;margin:12vh auto 0;padding:22px}#f h1{font-size:26px;margin:0}#erro{color:#b91c1c}
.stats{padding:12px 14px;font-size:17px;font-weight:600}
.cfg{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0;color:var(--mut);font-size:14px}.cfg select{padding:6px 10px}
.tabs{display:flex;background:#eaecf1;border-radius:var(--r);padding:3px;margin:12px 0}
.tab{flex:1;border:0;background:none;font-weight:500;color:var(--mut)}.tab.on{background:#fff;color:var(--ink);border:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px}.chip{white-space:nowrap;padding:6px 12px;font-size:14px;color:var(--mut)}
.chip.on{background:var(--wash);border-color:#c9caff;color:var(--ind)}.mut{color:var(--mut);font-size:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:10px 0;cursor:pointer}
.card.cancelado{opacity:.6}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.meta{color:var(--mut);font-size:14px;margin-top:2px}.warn{color:#b45309;font-weight:500}.chev{float:right}
.badge{font-size:12px;font-weight:600;padding:2px 9px;border-radius:var(--r)}
.badge.novo{background:#fef3c7;color:#b45309}.badge.preparando{background:var(--wash);color:var(--ind)}.badge.pronto{background:#dcfce7;color:#15803d}
.badge.entregue{background:#eef2f7;color:var(--mut)}.badge.cancelado{background:#fee2e2;color:#b91c1c}
pre{white-space:pre-wrap;font:13.5px/1.45 ui-monospace,Menlo,monospace;background:#f8fafd;border:1px solid var(--line);border-radius:var(--r);padding:10px;margin:10px 0 0}
.bt{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.dia{display:flex;justify-content:space-between}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r);z-index:9;font-size:14px}
dialog{border:1px solid var(--line);border-radius:var(--r);padding:18px;width:min(92vw,460px);color:var(--ink)}dialog::backdrop{background:#061b3155}
#fe{display:grid;gap:10px}#fe textarea{min-height:220px;font:13.5px/1.4 ui-monospace,monospace}#fe label{font-size:13px;color:var(--mut);display:grid;gap:4px}
#ticket{display:none;color:#000;background:#fff;font-family:'Courier New',monospace;font-weight:700;line-height:1.25;margin:0 auto;padding:2mm 0 22mm}
#ticket.w80{width:72mm;font-size:13px}#ticket.w58{width:48mm;font-size:11px}
#ticket div{white-space:pre-wrap;overflow-wrap:anywhere}#ticket .c{text-align:center}#ticket .big{font-size:1.25em}
#ticket .sp{height:6px}#ticket hr{border:0;border-top:2px dashed #000;margin:5px 0}
@media print{html,body{background:#fff!important;padding:0!important;margin:0!important}body>*:not(#ticket){display:none!important}#ticket{display:block}@page{margin:0}}
</style></head><body>
<header id="hd" hidden><div class="hd"><div class="brand"><span class="nm"></span><small>Painel de pedidos</small></div><span id="s" class="pill">…</span><button id="sair" style="margin-left:auto">Sair</button></div></header>
<form id="f" class="box"><h1 class="nm"></h1><span class="mut">Painel de pedidos</span><input id="em" type="email" placeholder="E-mail" autocomplete="username" required>
<input id="pw" type="password" placeholder="Senha" autocomplete="current-password" required><button>Entrar</button><div id="erro"></div></form>
<main id="app" hidden>
<div class="box stats" id="stats"></div>
<div class="cfg"><label><input type="checkbox" id="auto"> Imprimir novos automaticamente</label><select id="papel"><option value="w80">80 mm</option><option value="w58">58 mm</option></select></div>
<div class="tabs"><button class="tab" data-t="p">Pedidos</button><button class="tab" data-t="h">Histórico</button></div>
<div id="vp"><div class="chips" id="chips"></div><div id="dtxt" class="mut"></div><div id="lista"></div></div>
<div id="vh" hidden></div></main>
<dialog id="dlg"><form id="fe"><b>Editar pedido</b><label>Nome<input id="ec" maxlength="80" required></label>
<label>Total (R$)<input id="et" type="number" step="0.01" min="0" required></label>
<label>Pedido (texto do cupom)<textarea id="ed"></textarea></label>
<div class="bt"><button type="button" id="ecancel">Cancelar</button><button class="pri">Salvar</button></div></form></dialog>
<div id="toast" hidden></div>
<div id="ticket"></div>
<script>
const CFG={url:'https://svvvzwsajneesmuatcvc.supabase.co',key:'sb_publishable_ARLDqBsmhhhfOUp6I2zKiw_9G7pQ5_O',nome:'Rancharia'};
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),R=v=>(+v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let ses=LS('ses',null),P=[],seen=null,last='',auto=LS('auto',false),papel=LS('papel','w80'),aba='p',filtro='ativos',diaSel=null,tm=null,audio=null;
const dia=p=>new Date(p.created_at).toLocaleDateString('sv-SE'),hoje=()=>new Date().toLocaleDateString('sv-SE');
const tipo=p=>((p.detalhes||'').match(/^Tipo:\s*(.+)$/m)||[])[1]||'';
const ATIVO=['novo','preparando','pronto'],NX={novo:['preparando','Preparando'],preparando:['pronto','Pronto'],pronto:['entregue','Entregue']};
const FI=[['ativos','Ativos'],['novo','Novos'],['preparando','Preparando'],['pronto','Prontos'],['entregue','Entregues'],['cancelado','Cancelados'],['todos','Todos']];
document.querySelectorAll('.nm').forEach(e=>e.textContent=CFG.nome);$('#auto').checked=auto;$('#papel').value=papel;
$('#chips').innerHTML=FI.map(f=>`<button class="chip" data-f="${f[0]}">${f[1]}</button>`).join('');

async function auth(kind,body){const r=await fetch(CFG.url+'/auth/v1/token?grant_type='+kind,{method:'POST',headers:{apikey:CFG.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
 const j=await r.json();if(!r.ok)throw new Error('auth');j.exp=Date.now()+(j.expires_in-60)*1000;ses=j;SV('ses',j)}
async function api(path,opt={}){if(Date.now()>ses.exp)await auth('refresh_token',{refresh_token:ses.refresh_token});
 const r=await fetch(CFG.url+'/rest/v1/'+path,{...opt,headers:{apikey:CFG.key,Authorization:'Bearer '+ses.access_token,'Content-Type':'application/json',...(opt.headers||{})}});
 if(!r.ok)throw new Error(r.status);return opt.method==='PATCH'?null:r.json()}

$('#f').onsubmit=async e=>{e.preventDefault();$('#erro').textContent='';audio=audio||new AudioContext();
 try{await auth('password',{email:$('#em').value.trim(),password:$('#pw').value});entrar()}catch(x){$('#erro').textContent='E-mail ou senha incorretos.'}};
function entrar(){$('#f').hidden=true;$('#app').hidden=false;$('#hd').hidden=false;carregar();clearInterval(tm);tm=setInterval(carregar,5000);try{navigator.wakeLock.request('screen')}catch(e){}}
function sair(){localStorage.removeItem('ses');ses=null;clearInterval(tm);seen=null;last='';$('#app').hidden=true;$('#hd').hidden=true;$('#f').hidden=false}
$('#sair').onclick=sair;

function beep(){try{const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=880;g.gain.value=.2;o.start();o.stop(audio.currentTime+.3)}catch(e){}}
async function carregar(){try{const d=await api('pedidos?select=id,created_at,cliente,total,detalhes,status,impresso_em&order=created_at.desc&limit=500');
 $('#s').textContent='Ao vivo';$('#s').className='pill ok';
 const novos=seen?d.filter(p=>!seen.has(p.id)):[];seen=new Set(d.map(p=>p.id));
 const h=JSON.stringify(d);if(h===last)return;last=h;P=d;desenhar();
 if(novos.length){beep();if(auto)novos.reverse().forEach(imprimir)}
}catch(e){if(e.message==='401'||e.message==='auth')sair();else{$('#s').textContent='Sem conexão';$('#s').className='pill'}}}

const ST={novo:'Novo',preparando:'Preparando',pronto:'Pronto',entregue:'Entregue',cancelado:'Cancelado'},ab={};
const aberto=p=>ab[p.id]??(p.status==='novo');
function card(p){const nx=NX[p.status],a=ATIVO.includes(p.status),o=aberto(p),b=(x,t,c,ic)=>`<button class="${c||''}" data-a="${x}" data-id="${p.id}"${ic?` aria-label="${ic}" title="${ic}"`:''}>${t}</button>`;
 return `<div class="card" data-id="${p.id}"><div class="top"><b>#${pad(p.n)} ${esc(p.cliente)}</b><span class="badge ${p.status}">${ST[p.status]}</span></div>
<div class="meta">${new Date(p.created_at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})} · ${esc(tipo(p)||'—')} · <b>${R(p.total)}</b>${p.impresso_em?' · 🖨️ impresso':(a?' · <span class="warn">não impresso</span>':'')}<span class="chev">${o?'▾':'▸'}</span></div>
${o?`<pre>${esc((p.detalhes||'').replace(/\*/g,''))}</pre>`:''}
<div class="bt">${b('print','🖨️ Imprimir')}${nx?b(nx[0],nx[1],'pri'):''}${a?b('cancelado','Cancelar','rd'):''}${b('edit','✍️','ic','Editar pedido')}</div></div>`}

function desenhar(){const m={};[...P].reverse().forEach(p=>{const d=dia(p);m[d]=(m[d]||0)+1;p.n=m[d]});
 const hj=P.filter(p=>dia(p)===hoje()&&p.status!=='cancelado');
 $('#stats').textContent=hj.length+' pedidos hoje · '+R(hj.reduce((s,p)=>s+ +p.total,0));
 $('#vp').hidden=aba!=='p';$('#vh').hidden=aba!=='h';
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===aba));
 document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b.dataset.f===filtro));
 const d=diaSel||hoje();$('#dtxt').innerHTML=diaSel?'Dia '+d.split('-').reverse().join('/')+' <button id="hj">voltar para hoje</button>':'';
 const L=P.filter(p=>dia(p)===d&&(filtro==='todos'||(filtro==='ativos'?ATIVO.includes(p.status):p.status===filtro)));
 $('#lista').innerHTML=L.length?L.map(card).join(''):'<p class="mut">Nenhum pedido aqui.</p>';
 const g={};P.forEach(p=>{const k=dia(p);g[k]=g[k]||{n:0,t:0};g[k].n++;if(p.status!=='cancelado')g[k].t+=+p.total});
 $('#vh').innerHTML=Object.keys(g).sort().reverse().map(k=>`<div class="card dia" data-d="${k}"><b>${k.split('-').reverse().join('/')}</b><span>${g[k].n} pedidos · ${R(g[k].t)}</span></div>`).join('')||'<p class="mut">Sem histórico.</p>'}

const fila=[];let ocup=false;
function imprimir(p,sync){fila.push(p);bomba(sync)}
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(e.t);e.t=setTimeout(()=>e.hidden=true,2500)}
function bomba(sync){if(ocup||!fila.length)return;ocup=true;const p=fila.shift();
 const go=()=>{try{cupom(p);toast('🖨️ Enviando para impressão…');window.print()}catch(e){toast('Não foi possível abrir a impressão')}
  if(!p.impresso_em)mudar(p,{impresso_em:new Date().toISOString()});setTimeout(()=>{ocup=false;bomba()},1500)};
 sync?go():setTimeout(go,150)}
function cupom(p){const t=$('#ticket');t.className=papel;t.innerHTML='';
 const add=(x,c)=>{const d=document.createElement('div');if(c)d.className=c;d.textContent=x;t.appendChild(d)};
 add('PEDIDO Nº '+pad(p.n||0),'c big');add(new Date(p.created_at).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}),'c');t.appendChild(document.createElement('hr'));
 (p.detalhes?p.detalhes.replace(/\*/g,''):'Cliente: '+p.cliente+'\nTotal: '+R(p.total)).split('\n').forEach(l=>{l=l.trimEnd();
  if(/^[━─=\-]{5,}$/.test(l.trim()))t.appendChild(document.createElement('hr'));
  else if(!l.trim()){const s=document.createElement('div');s.className='sp';t.appendChild(s)}
  else add(l,/^(Tipo:|Total:)/.test(l)?'big':'')})}

async function mudar(p,c){try{await api('pedidos?id=eq.'+p.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(c)});Object.assign(p,c);last='';desenhar();return true}catch(e){alert('Não foi possível salvar. Confira a conexão (e se o SQL de edição foi rodado).');return false}}
$('#lista').onclick=e=>{const c=e.target.closest('.card');if(!c)return;const p=P.find(x=>String(x.id)===c.dataset.id),b=e.target.closest('button');
 if(!p)return;if(!b){ab[p.id]=!aberto(p);desenhar();return}const a=b.dataset.a;
 if(a==='print')imprimir(p,true);else if(a==='edit')editar(p);else if(a!=='cancelado'||confirm('Cancelar este pedido?'))mudar(p,{status:a})};
function editar(p){edP=p;$('#ec').value=p.cliente;$('#et').value=p.total;$('#ed').value=p.detalhes||'';$('#dlg').showModal()}
let edP=null;
$('#fe').onsubmit=async e=>{e.preventDefault();const c={cliente:$('#ec').value.trim().slice(0,80),total:parseFloat($('#et').value),detalhes:$('#ed').value.slice(0,4000)};
 if(!c.cliente||!(c.total>=0)){alert('Confira o nome e o total.');return}if(await mudar(edP,c))$('#dlg').close()};
$('#ecancel').onclick=()=>$('#dlg').close();
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{aba=b.dataset.t;desenhar()});
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filtro=b.dataset.f;desenhar()});
$('#dtxt').onclick=e=>{if(e.target.id==='hj'){diaSel=null;desenhar()}};
$('#vh').onclick=e=>{const c=e.target.closest('[data-d]');if(c){diaSel=c.dataset.d===hoje()?null:c.dataset.d;filtro='todos';aba='p';desenhar()}};
$('#auto').onchange=e=>{auto=e.target.checked;SV('auto',auto)};$('#papel').onchange=e=>{papel=e.target.value;SV('papel',papel)};
document.addEventListener('click',()=>{audio=audio||new AudioContext()},{once:true});
if(ses)entrar();
</script></body></html>
