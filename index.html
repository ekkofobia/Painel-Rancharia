<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Painel de pedidos</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0 auto;font:16px/1.4 system-ui,sans-serif;background:#111;color:#eee;padding:14px;max-width:720px}
h1{font-size:19px;margin:0}button,input,select{font:inherit;padding:9px 13px;border-radius:10px;border:1px solid #444;background:#222;color:#eee}
button.pri,#f button{background:#16a34a;border-color:#16a34a;color:#fff}button.rd{color:#f87171}
.mut,small{color:#9a9a9a;font-size:14px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
#f{display:grid;gap:10px;margin-top:20vh}#erro{color:#f87171}
.pill{padding:3px 10px;border-radius:99px;font-size:13px;background:#444}.pill.ok{background:#14532d;color:#bbf7d0}
.tab.on,.chip.on{background:#eee;color:#111}.chip{padding:6px 11px;font-size:14px}
.card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;padding:11px 13px;margin:9px 0}
.card.nao{border-color:#f59e0b}.card.cancelado{opacity:.55}.top{display:flex;justify-content:space-between;gap:8px}
.st{font-size:13px;text-transform:uppercase;color:#86efac}.bt{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
pre{white-space:pre-wrap;font:14px/1.4 ui-monospace,monospace;margin:6px 0}.dia{cursor:pointer;display:flex;justify-content:space-between}
#ticket{display:none;color:#000;background:#fff;font-family:'Courier New',monospace;font-weight:700;line-height:1.25;margin:0 auto;padding:2mm 0 22mm}
#ticket.w80{width:72mm;font-size:13px}#ticket.w58{width:48mm;font-size:11px}
#ticket div{white-space:pre-wrap;overflow-wrap:anywhere}#ticket .c{text-align:center}#ticket .big{font-size:1.25em}
#ticket .sp{height:6px}#ticket hr{border:0;border-top:2px dashed #000;margin:5px 0}
@media print{html,body{background:#fff!important;padding:0!important;margin:0!important}body>*:not(#ticket){display:none!important}#ticket{display:block}@page{margin:0}}
</style></head><body>
<form id="f"><h1>🔒 Painel de pedidos</h1><input id="em" type="email" placeholder="E-mail" autocomplete="username" required>
<input id="pw" type="password" placeholder="Senha" autocomplete="current-password" required><button>Entrar</button><div id="erro"></div></form>
<div id="app" hidden>
<div class="row"><h1>Painel · <span id="nm"></span></h1><span id="s" class="pill">…</span><button id="sair" style="margin-left:auto">Sair</button></div>
<div id="stats" class="mut"></div>
<div class="row"><label><input type="checkbox" id="auto"> Imprimir novos automaticamente</label>
<select id="papel"><option value="w80">80 mm</option><option value="w58">58 mm</option></select></div>
<div class="row"><button class="tab" data-t="p">Pedidos</button><button class="tab" data-t="h">Histórico</button></div>
<div id="vp"><div class="row" id="chips"></div><div id="dtxt" class="mut"></div><div id="lista"></div></div>
<div id="vh" hidden></div></div>
<div id="ticket"></div>
<script>
const CFG={url:'https://svvvzwsajneesmuatcvc.supabase.co',key:'sb_publishable_ARLDqBsmhhhfOUp6I2zKiw_9G7pQ5_O',nome:'Rancharia'};
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),R=v=>(+v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let ses=LS('ses',null),P=[],seen=null,last='',auto=LS('auto',false),papel=LS('papel','w80'),aba='p',filtro='ativos',diaSel=null,tm=null,audio=null;
const dia=p=>new Date(p.created_at).toLocaleDateString('sv-SE'),hoje=()=>new Date().toLocaleDateString('sv-SE');
const tipo=p=>((p.detalhes||'').match(/^Tipo:\s*(.+)$/m)||[])[1]||'';
const ATIVO=['novo','preparando','pronto'],NX={novo:['preparando','Preparando'],preparando:['pronto','Pronto'],pronto:['entregue','Entregue']};
const FI=[['ativos','Ativos'],['novo','Novos'],['preparando','Preparando'],['pronto','Prontos'],['entregue','Entregues'],['cancelado','Cancelados'],['todos','Todos']];
$('#nm').textContent=CFG.nome;$('#auto').checked=auto;$('#papel').value=papel;
$('#chips').innerHTML=FI.map(f=>`<button class="chip" data-f="${f[0]}">${f[1]}</button>`).join('');

async function auth(kind,body){const r=await fetch(CFG.url+'/auth/v1/token?grant_type='+kind,{method:'POST',headers:{apikey:CFG.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
 const j=await r.json();if(!r.ok)throw new Error('auth');j.exp=Date.now()+(j.expires_in-60)*1000;ses=j;SV('ses',j)}
async function api(path,opt={}){if(Date.now()>ses.exp)await auth('refresh_token',{refresh_token:ses.refresh_token});
 const r=await fetch(CFG.url+'/rest/v1/'+path,{...opt,headers:{apikey:CFG.key,Authorization:'Bearer '+ses.access_token,'Content-Type':'application/json',...(opt.headers||{})}});
 if(!r.ok)throw new Error(r.status);return opt.method==='PATCH'?null:r.json()}

$('#f').onsubmit=async e=>{e.preventDefault();$('#erro').textContent='';audio=audio||new AudioContext();
 try{await auth('password',{email:$('#em').value.trim(),password:$('#pw').value});entrar()}catch(x){$('#erro').textContent='E-mail ou senha incorretos.'}};
function entrar(){$('#f').hidden=true;$('#app').hidden=false;carregar();clearInterval(tm);tm=setInterval(carregar,5000);try{navigator.wakeLock.request('screen')}catch(e){}}
function sair(){localStorage.removeItem('ses');ses=null;clearInterval(tm);seen=null;last='';$('#app').hidden=true;$('#f').hidden=false}
$('#sair').onclick=sair;

function beep(){try{const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=880;g.gain.value=.2;o.start();o.stop(audio.currentTime+.3)}catch(e){}}
async function carregar(){try{const d=await api('pedidos?select=id,created_at,cliente,total,detalhes,status,impresso_em&order=created_at.desc&limit=500');
 $('#s').textContent='Ao vivo';$('#s').className='pill ok';
 const novos=seen?d.filter(p=>!seen.has(p.id)):[];seen=new Set(d.map(p=>p.id));
 const h=JSON.stringify(d);if(h===last)return;last=h;P=d;desenhar();
 if(novos.length){beep();if(auto)novos.reverse().forEach(imprimir)}
}catch(e){if(e.message==='401'||e.message==='auth')sair();else{$('#s').textContent='Sem conexão';$('#s').className='pill'}}}

function card(p){const nx=NX[p.status],a=ATIVO.includes(p.status),b=(x,t,c)=>`<button class="${c||''}" data-a="${x}" data-id="${p.id}">${t}</button>`;
 return `<div class="card ${p.status}${p.impresso_em?'':' nao'}"><div class="top"><b>#${pad(p.n)} ${esc(p.cliente)}</b><span class="st">${p.status}</span></div>
<small>${new Date(p.created_at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})} · ${esc(tipo(p)||'—')} · ${R(p.total)}${p.impresso_em?' · 🖨️ impresso':' · não impresso'}</small>
<details ${p.status==='novo'?'open':''}><summary class="mut">Ver pedido</summary><pre>${esc((p.detalhes||'').replace(/\*/g,''))}</pre></details>
<div class="bt">${b('print','🖨️ Imprimir')}${nx?b(nx[0],nx[1],'pri'):''}${a?b('cancelado','Cancelar','rd'):''}</div></div>`}

function desenhar(){const m={};[...P].reverse().forEach(p=>{const d=dia(p);m[d]=(m[d]||0)+1;p.n=m[d]});
 const hj=P.filter(p=>dia(p)===hoje()&&p.status!=='cancelado');
 $('#stats').textContent=hj.length+' pedidos hoje · '+R(hj.reduce((s,p)=>s+ +p.total,0));
 $('#vp').hidden=aba!=='p';$('#vh').hidden=aba!=='h';
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===aba));
 document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b.dataset.f===filtro));
 const d=diaSel||hoje();$('#dtxt').innerHTML=diaSel?'Dia '+d.split('-').reverse().join('/')+' <button id="hj">voltar para hoje</button>':'';
 const L=P.filter(p=>dia(p)===d&&(filtro==='todos'||(filtro==='ativos'?ATIVO.includes(p.status):p.status===filtro)));
 $('#lista').innerHTML=L.length?L.map(card).join(''):'<p class="mut">Nenhum pedido aqui.</p>';
 const g={};P.forEach(p=>{const k=dia(p);g[k]=g[k]||{n:0,t:0};g[k].n++;if(p.status!=='cancelado')g[k].t+=+p.total});
 $('#vh').innerHTML=Object.keys(g).sort().reverse().map(k=>`<div class="card dia" data-d="${k}"><b>${k.split('-').reverse().join('/')}</b><span>${g[k].n} pedidos · ${R(g[k].t)}</span></div>`).join('')||'<p class="mut">Sem histórico.</p>'}

const fila=[];let ocup=false;
function imprimir(p){fila.push(p);bomba()}
function bomba(){if(ocup||!fila.length)return;ocup=true;const p=fila.shift();cupom(p);
 setTimeout(()=>{try{window.print()}catch(e){}if(!p.impresso_em)mudar(p,{impresso_em:new Date().toISOString()});setTimeout(()=>{ocup=false;bomba()},1500)},150)}
function cupom(p){const t=$('#ticket');t.className=papel;t.innerHTML='';
 const add=(x,c)=>{const d=document.createElement('div');if(c)d.className=c;d.textContent=x;t.appendChild(d)};
 add('PEDIDO Nº '+pad(p.n||0),'c big');add(new Date(p.created_at).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}),'c');t.appendChild(document.createElement('hr'));
 (p.detalhes?p.detalhes.replace(/\*/g,''):'Cliente: '+p.cliente+'\nTotal: '+R(p.total)).split('\n').forEach(l=>{l=l.trimEnd();
  if(/^[━─=\-]{5,}$/.test(l.trim()))t.appendChild(document.createElement('hr'));
  else if(!l.trim()){const s=document.createElement('div');s.className='sp';t.appendChild(s)}
  else add(l,/^(Tipo:|Total:)/.test(l)?'big':'')})}

async function mudar(p,c){try{await api('pedidos?id=eq.'+p.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(c)});Object.assign(p,c);last='';desenhar()}catch(e){alert('Não foi possível salvar. Confira a conexão.')}}
$('#lista').onclick=e=>{const b=e.target.closest('button');if(!b)return;const p=P.find(x=>String(x.id)===b.dataset.id),a=b.dataset.a;
 if(a==='print')imprimir(p);else if(a!=='cancelado'||confirm('Cancelar este pedido?'))mudar(p,{status:a})};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{aba=b.dataset.t;desenhar()});
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filtro=b.dataset.f;desenhar()});
$('#dtxt').onclick=e=>{if(e.target.id==='hj'){diaSel=null;desenhar()}};
$('#vh').onclick=e=>{const c=e.target.closest('[data-d]');if(c){diaSel=c.dataset.d===hoje()?null:c.dataset.d;filtro='todos';aba='p';desenhar()}};
$('#auto').onchange=e=>{auto=e.target.checked;SV('auto',auto)};$('#papel').onchange=e=>{papel=e.target.value;SV('papel',papel)};
document.addEventListener('click',()=>{audio=audio||new AudioContext()},{once:true});
if(ses)entrar();
</script></body></html>
